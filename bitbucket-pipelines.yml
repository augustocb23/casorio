image: node:10.15.3

pipelines:
  branches:
    master:
      - parallel:
        - step:
            name: Build
            caches:
              - node
            script:
              - npm install
              - apt update && apt install zip
              - zip -r app-$BITBUCKET_BUILD_NUMBER.zip . -x *.git* bitbucket-pipelines.yml
            artifacts:
              - "*.zip"
        - step:
            name: Security Scan
            script:
              # Run a security scan for sensitive data.
              - pipe: atlassian/git-secrets-scan:0.4.3
      - step:
          name: Deploy to Production
          trigger: manual
          deployment: Production
          script:
            - scp -r $BITBUCKET_CLONE_DIR/app-$BITBUCKET_BUILD_NUMBER.zip bitnami@$SERVER:app-$BITBUCKET_BUILD_NUMBER.zip
            - ssh -T bitnami@$SERVER "unzip -o app-$BITBUCKET_BUILD_NUMBER.zip -d dist"
            - ssh -T bitnami@$SERVER "bash -s" < $BITBUCKET_CLONE_DIR/deploy.sh
